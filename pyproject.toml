[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gummy-amazon"
version = "0.1.0"
description = "Small, quota-bounded Amazon collection worker and gummy read API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6,<1",
  "httpx>=0.28.1,<1",
  "pydantic>=2.11.7,<3",
  "python-dotenv>=1,<2",
  "SQLAlchemy>=2.0.42,<2.1",
  "uvicorn>=0.32.1,<1",
  "openpyxl>=3.1.5,<3.2",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8.4.2,<9", "ruff>=0.12,<1"]

[project.scripts]
gummy = "gummy.cli:main"

[tool.setuptools.packages.find]
include = ["gummy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".work", "output"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"gummy/ui.py" = ["E501"] # HTML and CSS markup is kept together for the local page.
"gummy/workspace_ui.py" = ["E501"] # Server-rendered local workspace markup.
"gummy/review_ui.py" = ["E501"] # Guided review markup.
"gummy/analysis_ui.py" = ["E501"] # Period sample analysis markup.
"gummy/operations_ui.py" = ["E501"] # Local operations markup.
"gummy/schedule_routes.py" = ["E501"] # Guided schedule forms and preview markup.
"gummy/report_routes.py" = ["E501"] # Fixed-scope report center markup.
